<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern AI Agent Interface</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 引入 Inter 字体提升高级感 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            50: '#F9FAFB',
                            100: '#F3F4F6',
                            200: '#E5E7EB',
                            300: '#D1D5DB',
                            800: '#1F2937',
                            900: '#111827',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-white text-gray-800 h-screen flex overflow-hidden antialiased selection:bg-gray-200">

    <!-- 侧边栏 (Sidebar) - 极简深色/浅色混合风格 -->
    <aside class="w-[280px] bg-gray-50 border-r border-gray-200 flex flex-col flex-shrink-0">
        <!-- 顶部：新建对话 / 品牌区 -->
        <div class="p-4">
            <button class="w-full flex items-center justify-between bg-white border border-gray-200 hover:border-gray-300 hover:shadow-sm transition-all text-gray-800 rounded-xl px-4 py-2.5 font-medium text-sm">
                <span class="flex items-center gap-2">
                    <img src="https://api.dicebear.com/7.x/shapes/svg?seed=brand" class="w-5 h-5 rounded-md" alt="logo">
                    新对话
                </span>
                <i data-lucide="edit" class="w-4 h-4 text-gray-500"></i>
            </button>
        </div>

        <!-- 智能体列表 -->
        <div class="flex-1 overflow-y-auto no-scrollbar px-3 py-2">
            <div class="text-xs font-semibold text-gray-400 mb-3 px-3 tracking-wider">我的智能体</div>
            
            <ul class="space-y-1">
                <!-- 未选中状态 -->
                <li>
                    <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-gray-200/50 text-gray-700 transition-colors group">
                        <div class="w-6 h-6 rounded-md bg-blue-100 flex items-center justify-center text-blue-600 shrink-0">
                            <i data-lucide="code" class="w-3.5 h-3.5"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-medium truncate group-hover:text-gray-900">代码大师</div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-gray-200/50 text-gray-700 transition-colors group">
                        <div class="w-6 h-6 rounded-md bg-purple-100 flex items-center justify-center text-purple-600 shrink-0">
                            <i data-lucide="pen-tool" class="w-3.5 h-3.5"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-medium truncate group-hover:text-gray-900">设计评论家</div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-gray-200/50 text-gray-700 transition-colors group">
                        <div class="w-6 h-6 rounded-md bg-orange-100 flex items-center justify-center text-orange-600 shrink-0">
                            <i data-lucide="coffee" class="w-3.5 h-3.5"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-medium truncate group-hover:text-gray-900">佛系青年</div>
                        </div>
                    </a>
                </li>

                <!-- 当前选中状态 (Active) -->
                <li>
                    <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-white border border-gray-200 shadow-sm text-gray-900 transition-colors relative">
                        <div class="w-6 h-6 rounded-md bg-emerald-100 flex items-center justify-center text-emerald-600 shrink-0">
                            <i data-lucide="apple" class="w-3.5 h-3.5"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-semibold truncate">营养师</div>
                        </div>
                        <!-- 选中指示器 -->
                        <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-5 bg-gray-900 rounded-r-full"></div>
                    </a>
                </li>
            </ul>
        </div>

        <!-- 底部用户区 -->
        <div class="p-4 border-t border-gray-200">
            <button class="flex items-center gap-3 w-full px-2 py-2 hover:bg-gray-200/50 rounded-xl transition-colors">
                <div class="w-8 h-8 rounded-full bg-gray-300 overflow-hidden shrink-0">
                    <!-- 头像占位 -->
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User" class="w-full h-full object-cover">
                </div>
                <div class="flex-1 text-left">
                    <div class="text-sm font-medium text-gray-800">南辰</div>
                    <div class="text-xs text-gray-500">Free Plan</div>
                </div>
                <i data-lucide="settings" class="w-4 h-4 text-gray-400"></i>
            </button>
        </div>
    </aside>

    <!-- 主对话区 (Main Chat Area) -->
    <main class="flex-1 flex flex-col relative bg-white min-w-0">
        
        <!-- 顶部 Header (轻量化) -->
        <header class="h-14 flex items-center justify-between px-6 border-b border-transparent hover:border-gray-100 transition-colors shrink-0">
            <div class="flex items-center gap-2">
                <span class="text-gray-800 font-semibold">营养师</span>
                <span class="px-1.5 py-0.5 rounded-md bg-gray-100 text-gray-500 text-[10px] font-medium border border-gray-200">AI Agent</span>
            </div>
            <button class="p-2 text-gray-400 hover:text-gray-700 rounded-lg hover:bg-gray-100 transition-colors" title="清除对话">
                <i data-lucide="eraser" class="w-4 h-4"></i>
            </button>
        </header>

        <!-- 对话内容流 (无气泡设计) -->
        <div class="flex-1 overflow-y-auto no-scrollbar scroll-smooth">
            <div class="max-w-3xl mx-auto py-8 px-4 sm:px-6 flex flex-col gap-8 pb-32">
                
                <!-- AI 消息 (无气泡，纯文本流) -->
                <div class="flex gap-4 sm:gap-6 group">
                    <!-- AI 头像 -->
                    <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 shrink-0 mt-0.5 border border-emerald-200">
                        <i data-lucide="apple" class="w-4 h-4"></i>
                    </div>
                    <!-- 内容区 -->
                    <div class="flex-1 space-y-4">
                        <div class="font-semibold text-gray-900 text-sm">营养师</div>
                        <div class="prose prose-slate max-w-none text-gray-700 leading-relaxed text-[15px]">
                            <p>你好！我是你的专属营养师。想了解如何科学饮食、健康减脂或者改善生活作息吗？随时问我吧！</p>
                        </div>
                        <!-- 底部操作栏 (悬浮显现) -->
                        <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button class="p-1.5 text-gray-400 hover:text-gray-700 rounded hover:bg-gray-100"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                            <button class="p-1.5 text-gray-400 hover:text-gray-700 rounded hover:bg-gray-100"><i data-lucide="thumbs-up" class="w-3.5 h-3.5"></i></button>
                            <button class="p-1.5 text-gray-400 hover:text-gray-700 rounded hover:bg-gray-100"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>
                </div>

                <!-- 可以在这里继续添加 User 消息的占位，格式同上，头像换成用户头像，右侧排版或同样的左侧排版 -->

            </div>
        </div>

        <!-- 底部全局输入框区 (悬浮沉浸式) -->
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-white via-white to-transparent pt-10 pb-6 px-4 sm:px-6">
            <div class="max-w-3xl mx-auto relative">
                <!-- 输入框主体 -->
                <div class="bg-white border border-gray-200 rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.04)] focus-within:shadow-[0_0_25px_rgba(0,0,0,0.08)] focus-within:border-gray-300 transition-all duration-300 flex flex-col">
                    
                    <textarea 
                        class="w-full max-h-[200px] bg-transparent px-4 py-4 text-[15px] outline-none resize-none placeholder-gray-400 text-gray-800"
                        rows="2"
                        placeholder="向 营养师 发送消息..."></textarea>
                    
                    <!-- 底部工具栏 -->
                    <div class="flex items-center justify-between px-3 pb-3 pt-1">
                        <!-- 左侧：附件与模型 -->
                        <div class="flex items-center gap-1">
                            <button class="p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors" title="上传附件">
                                <i data-lucide="paperclip" class="w-4 h-4"></i>
                            </button>
                            <!-- 模型选择器 (极简) -->
                            <button class="flex items-center gap-1.5 px-2 py-1.5 rounded-lg hover:bg-gray-100 text-xs font-medium text-gray-500 transition-colors ml-1">
                                <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                                DeepSeek-OCR
                                <i data-lucide="chevron-down" class="w-3 h-3 text-gray-400"></i>
                            </button>
                        </div>
                        
                        <!-- 右侧：发送 -->
                        <div class="flex items-center gap-3">
                            <span class="text-xs text-gray-400 hidden sm:block font-medium">↵ Send</span>
                            <!-- 黑色高级感发送按钮 -->
                            <button class="bg-gray-900 hover:bg-gray-800 text-white p-2 rounded-xl transition-colors flex items-center justify-center">
                                <i data-lucide="arrow-up" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 底部免责声明 (增加真实感) -->
                <div class="text-center mt-3">
                    <span class="text-[11px] text-gray-400">AI 可能会生成不准确的信息。请核实重要的医学或营养建议。</span>
                </div>
            </div>
        </div>

    </main>

    <script>
        // 初始化图标
        lucide.createIcons();
    </script>
</body>
</html>
