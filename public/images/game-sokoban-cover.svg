<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#403b4a"/>
      <stop offset="100%" stop-color="#e7e9bb"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0a30a"/>
      <stop offset="100%" stop-color="#d47a00"/>
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#3a6073"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Title -->
  <text x="200" y="48" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#403b4a" text-anchor="middle" letter-spacing="1">SOKOBAN</text>
  <text x="200" y="66" font-family="Arial, sans-serif" font-size="10" fill="#403b4a" text-anchor="middle" font-weight="bold" letter-spacing="3">THE WAREHOUSE PUZZLE</text>

  <!-- Board Layout: Center grid x=80, y=85, 240×180 -->
  <rect x="80" y="85" width="240" height="180" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>

  <!-- Warehouse grid (6x4 cells of 40x45) -->
  <path d="M 120 85 L 120 265 M 160 85 L 160 265 M 200 85 L 200 265 M 240 85 L 240 265 M 280 85 L 280 270" stroke="#cbd5e1" stroke-width="0.5"/>
  <path d="M 80 130 L 320 130 M 80 175 L 320 175 M 80 220 L 320 220" stroke="#cbd5e1" stroke-width="0.5"/>

  <!-- Target Point 1 (Purple Star/Dot) at (160-200, 130-175) -->
  <circle cx="180" cy="152.5" r="8" fill="none" stroke="#a855f7" stroke-width="3"/>
  <circle cx="180" cy="152.5" r="3" fill="#a855f7"/>

  <!-- Target Point 2 (Purple Star/Dot) at (240-280, 175-220) -->
  <circle cx="260" cy="197.5" r="8" fill="none" stroke="#a855f7" stroke-width="3"/>
  <circle cx="260" cy="197.5" r="3" fill="#a855f7"/>

  <!-- Box 1 (Wooden Crate) on Target Point 1 (x:160, y:130) -->
  <g filter="url(#shadow)">
    <rect x="163" y="133" width="34" height="39" rx="4" fill="url(#boxGrad)" stroke="#b45309" stroke-width="1.5"/>
    <!-- Crate wood planks detail -->
    <line x1="163" y1="133" x2="197" y2="172" stroke="#b45309" stroke-width="1.5"/>
    <line x1="197" y1="133" x2="163" y2="172" stroke="#b45309" stroke-width="1.5"/>
    <rect x="168" y="138" width="24" height="29" fill="none" stroke="#b45309" stroke-width="1"/>
  </g>

  <!-- Box 2 (Wooden Crate) not on target (x:200, y:175) -->
  <g filter="url(#shadow)">
    <rect x="203" y="178" width="34" height="39" rx="4" fill="url(#boxGrad)" stroke="#b45309" stroke-width="1.5"/>
    <!-- Crate wood planks detail -->
    <line x1="203" y1="178" x2="237" y2="217" stroke="#b45309" stroke-width="1.5"/>
    <line x1="237" y1="178" x2="203" y2="217" stroke="#b45309" stroke-width="1.5"/>
    <rect x="208" y="183" width="24" height="29" fill="none" stroke="#b45309" stroke-width="1"/>
  </g>

  <!-- Worker / Player pushing (x:120, y:175) -->
  <g filter="url(#shadow)">
    <!-- Body -->
    <circle cx="140" cy="190" r="9" fill="url(#workerGrad)"/>
    <circle cx="140" cy="190" r="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Head/Hat -->
    <circle cx="140" cy="190" r="5" fill="#fecdd3"/>
    <!-- Cap Brim -->
    <path d="M 137 186 Q 140 182 144 186" stroke="#e11d48" stroke-width="2.5" fill="none"/>
    <!-- Hands pushing forward -->
    <circle cx="149" cy="195" r="3.5" fill="#fecdd3"/>
    <circle cx="149" cy="185" r="3.5" fill="#fecdd3"/>
  </g>

  <!-- Industrial Walls (Gray Brick style) at outer boundaries -->
  <!-- Left Wall -->
  <rect x="80" y="85" width="40" height="45" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="107.5" x2="120" y2="107.5" stroke="#475569" stroke-width="1"/>
  
  <!-- Top Wall -->
  <rect x="120" y="85" width="40" height="45" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  <line x1="120" y1="107.5" x2="160" y2="107.5" stroke="#475569" stroke-width="1"/>
  
  <rect x="280" y="220" width="40" height="45" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
</svg>
